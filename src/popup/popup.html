<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>2D-3D Video Converter</h1>
      <button id="toggle" title="Turn 3D on or off for this video">Off</button>
    </header>
    <p id="status" class="status">Checking tab…</p>

    <details class="section" data-section="depth" open>
      <summary>Depth Estimation</summary>
      <label title="How depth is estimated. Auto uses Depth Anything V2 and falls back to Heuristic if the GPU can't run it fast enough. The ML models run on the GPU via WebGPU and download once on first use. The rest are lightweight shaders that work on any GPU.">Algorithm
        <select id="algorithm">
          <option value="auto">Auto</option>
          <option value="heuristic" title="Blend of ground plane, brightness, color and center cues.">Heuristic</option>
          <option value="da2" title="ML. The best balance of quality and speed.">Depth Anything V2</option>
          <option value="da3" title="ML. Newer, about 12% slower than V2.">Depth Anything V3</option>
          <option value="midas" title="ML. About 4x faster than Depth Anything but blurrier, for slow GPUs.">MiDaS</option>
          <option value="scene" title="Picture content only: sharp, saturated, warm detail comes forward; hazy, washed-out, cool areas recede.">Scene Cues</option>
          <option value="ground" title="Assumes a flat floor: lower in the frame is nearer, everything above the horizon is far.">Ground Plane</option>
          <option value="motion" title="What moves faster on screen is nearer. Best with a moving camera; still shots fall back to a ground plane.">Motion Parallax</option>
        </select>
      </label>
      <label title="Size of the frame fed to the Depth Anything models (MiDaS always uses 256x256).">ML resolution
        <select id="mlResolution">
          <option value="196">196 px (fastest)</option>
          <option value="252">252 px</option>
          <option value="336">336 px</option>
          <option value="420">420 px (best)</option>
        </select>
      </label>
      <label>Smoothing <output for="smoothing"></output>
        <input id="smoothing" type="range" min="0" max="0.99" step="0.01" />
      </label>
      <label class="check" title="The ML model makes about 12 depth maps a second. This crossfades between them over the time until the next one, so depth changes continuously instead of in steps. Adds about one depth-map interval (~80 ms) of lag. Shot changes still switch instantly.">
        <input id="interpolateDepth" type="checkbox" /> Interpolate depth frames
      </label>
      <label class="check" title="Keeps depth exactly as it was at the moment you paused, so an artifact seen during playback stays on screen while you look at it or change settings. Normally depth keeps settling to the paused picture. Seeking or changing the algorithm updates depth again.">
        <input id="freezeOnPause" type="checkbox" /> Freeze depth when paused
      </label>
    </details>

    <details class="section" data-section="view" open>
      <summary>3D View</summary>
      <label>View Mode
        <select id="layout">
          <option value="hsbs">SBS</option>
          <option value="htab">TOB</option>
          <option value="anaglyph">Anaglyph (Red/Cyan)</option>
          <option value="depth">Depth Map</option>
          <option value="rgbd">Video | Depth Map</option>
        </select>
      </label>
      <label>3D strength <output for="strength"></output>
        <input id="strength" type="range" min="0" max="10" step="0.1" />
      </label>
      <label>Convergence <output for="convergence"></output>
        <input id="convergence" type="range" min="0" max="1" step="0.01" />
      </label>
      <label class="check"><input id="swapEyes" type="checkbox" /> Swap eyes</label>
    </details>

    <details class="section" data-section="cleanup" open>
      <summary>
        <label class="check" title="Turns all of the post-processing below on or off. Your settings are kept.">
          <input id="cleanup" type="checkbox" /> Artifact Cleanup
        </label>
        <button id="resetCleanup" class="small" title="Set everything in Artifact Cleanup back to the default, where nothing is altered.">Reset</button>
      </summary>
      <fieldset id="cleanupOptions">
        <label title="Grows near objects' depth outward so their rims move with them. Raise this if you see bright or dark outlines (halos) around objects.">Edge dilation <output for="edgeDilation"></output>
          <input id="edgeDilation" type="range" min="0" max="30" step="1" />
        </label>
        <label title="How strongly depth edges follow color edges. Higher is crisper but can make textured areas wobble. 0 = off.">Edge snapping <output for="edgeSnap"></output>
          <input id="edgeSnap" type="range" min="0" max="1" step="0.05" />
        </label>
        <label title="How background revealed beside shifted objects is filled.">Hole fill
          <select id="holeFill">
            <option value="off">Off (stretch edges)</option>
            <option value="mirror">Mirror (reflected background)</option>
            <option value="soft" title="Spreads the surrounding background smoothly into the gap, never the object's color. No streaks, but no texture either.">Soft (blended background)</option>
            <option value="sharp">Sharp (background)</option>
          </select>
        </label>
      </fieldset>
    </details>

    <details class="section" data-section="overlays" open>
      <summary>Overlays</summary>
      <label class="check"><input id="captions" type="checkbox" /> 3D captions (YouTube and standard)</label>
      <label class="check"><input id="showStats" type="checkbox" /> Show stats overlay</label>
    </details>

    <footer>
      <kbd>Alt+Shift+D</kbd> toggles 3D on the video under the mouse<br />
      <kbd>Alt+Shift+M</kbd> switches to the next view mode
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
